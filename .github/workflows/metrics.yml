name: Metrics
on:
  # Schedule updates (every 12 hours)
  schedule: [{cron: "0 */12 * * *"}]
  # Run workflow manually and on each push to main branch
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GitHub Personal Access Token (PAT) stored in repository secrets
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: danielhs00
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          filename: github-metrics.svg
          
          # Habits plugin (Average activity over the last 1 week)
          plugin_habits: yes
          plugin_habits_days: 7
          plugin_habits_facts: yes
          plugin_habits_charts: yes
